name: Generate GitHub Metrics

on:
  schedule:
    - cron: "17 18 * * *" # daily, 01:17 Vietnam time
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Stats + activity, counted from your contribution calendar (incl. private repos)
      - name: Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          committer_branch: metrics
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Ho_Chi_Minh
          config_display: large
          repositories_affiliations: owner, collaborator
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Most used languages across your own AND team repositories
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-languages.svg
          committer_branch: metrics
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          repositories_affiliations: owner, collaborator
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_ignored: html, css, jupyter notebook, batchfile, shell, dockerfile
